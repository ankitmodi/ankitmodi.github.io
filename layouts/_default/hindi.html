{{ define "main" }}
<h1>{{ .Title }}</h1>

<ul class="post-list">
    {{ range (where .Site.RegularPages "Params.categories" "intersect" (slice "Hindi")) }}
    <li>
        <span class="date">{{ .Date.Format "2006-01-02" }}</span>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
</ul>
{{ end }}
